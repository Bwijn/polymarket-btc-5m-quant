[project]
name = "polybot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "sqlmodel",
    "pandas",
    "websockets",         # PM CLOB market channel (book / price_change push)
    "py-clob-client-v2",  # live order placement (V1 cutover 2026-04-28, V2 only)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
